# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - Parlour

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'yarn'

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: yarn nocobase install
        run: yarn nocobase install

      - name: Build NocoBase
        run: yarn build

      - name: Create deployment archive
        run: |
          tar \
            --exclude='./.git' \
            -czf "${RUNNER_TEMP}/node-app.tar.gz" \
            -C "${GITHUB_WORKSPACE}" \
            .

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ${{ runner.temp }}/node-app.tar.gz
          compression-level: 0

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Extract deployment archive
        run: |
          mkdir -p deploy-package
          tar -xzf node-app.tar.gz -C deploy-package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0B50FD1B51454906B1679B2364E2A263 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D0070F8DA96C4D26B70FB93DB239AA2B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_19A41E31030C4C9CAD53552C41153402 }}

      - name: Disable Azure server-side build
        shell: bash
        run: |
          resource_group="$(az resource list \
            --name Parlour \
            --resource-type Microsoft.Web/sites \
            --query '[0].resourceGroup' \
            --output tsv)"

          if [ -z "$resource_group" ]; then
            echo "Unable to find the Azure resource group for Parlour." >&2
            exit 1
          fi

          az webapp config appsettings set \
            --name Parlour \
            --resource-group "$resource_group" \
            --settings \
              APP_PORT=8080 \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              ENABLE_ORYX_BUILD=false

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Parlour'
          slot-name: 'Production'
          package: deploy-package
