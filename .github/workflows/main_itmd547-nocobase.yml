# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - itmd547-nocobase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Enable Corepack (ensures correct Yarn version)
        run: corepack enable

      - name: Set Yarn network timeout
        run: yarn config set network-timeout 600000

      - name: yarn install and build
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AE4933D15EF44C91A1607D9B3B3517BA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4AD8AA1DD47949E19BEB9FAF6E926E5E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6F625E0D2F1D494BA9B5D5C07ED8205B }}

      - name: Configure App Service startup
        shell: bash
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          INIT_ROOT_PASSWORD: ${{ secrets.INIT_ROOT_PASSWORD }}
        run: |
          resource_group="$(az webapp list \
            --query "[?name=='itmd547-nocobase'].resourceGroup | [0]" \
            --output tsv)"

          if [ -z "$resource_group" ]; then
            echo "App Service 'itmd547-nocobase' was not found in the authenticated subscription." >&2
            exit 1
          fi

          echo "resource_group=$resource_group" >> "$GITHUB_ENV"

          az webapp config appsettings set \
            --name itmd547-nocobase \
            --resource-group "$resource_group" \
            --settings \
              APP_ENV=production \
              APP_PORT=8080 \
              WEBSITES_PORT=8080 \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              ENABLE_ORYX_BUILD=false \
              API_BASE_PATH=/api/ \
              DB_LOGGING=off \
              DB_DIALECT=postgres \
              DB_PORT=5432 \
              DB_DIALECT_OPTIONS_SSL_MODE=require \
              DB_DIALECT_OPTIONS_SSL_REJECT_UNAUTHORIZED=false \
              INIT_ROOT_EMAIL=admin@nocobase.com \
              INIT_ROOT_NICKNAME="Super Admin" \
              INIT_ROOT_USERNAME=nocobase \
              APP_KEY="$APP_KEY" \
              DB_HOST="$DB_HOST" \
              DB_DATABASE="$DB_DATABASE" \
              DB_USER="$DB_USER" \
              DB_PASSWORD="$DB_PASSWORD" \
              INIT_ROOT_PASSWORD="$INIT_ROOT_PASSWORD"

          az webapp config set \
            --name itmd547-nocobase \
            --resource-group "$resource_group" \
            --startup-file "bash startup.sh"

      - name: 'Deploy to Azure Web App (clean)'
        shell: bash
        run: |
          # Build straight into a zip in this same job/runner, with no
          # actions/upload-artifact or download-artifact round trip: those
          # actions zip/unzip through GitHub's artifact storage and can drop
          # or break symlinks, and node_modules/.bin entries created by
          # yarn classic (e.g. nocobase-v1) are exactly that - symlinks.
          # --clean wipes the target directory before extracting, so old
          # deployments never linger and get mixed into the new one.
          zip -r -q ../app.zip . -x ".git/*"

          # --async avoids a synchronous HTTP request that Azure's front end
          # gateway kills with a 504 once the (large) zip takes too long for
          # Kudu to process, so we poll deployment status separately below.
          az webapp deploy \
            --resource-group "$resource_group" \
            --name itmd547-nocobase \
            --src-path ../app.zip \
            --type zip \
            --clean true \
            --restart true \
            --async true

          echo "Polling deployment status..."
          for i in $(seq 1 120); do
            status="$(az webapp deployment list \
              --resource-group "$resource_group" \
              --name itmd547-nocobase \
              --query "[0].status" \
              --output tsv)"
            echo "[$i] deployment status=$status"

            # Kudu deployment status: 0=Pending 1=Building 2=Deploying 3=Failed 4=Success
            if [ "$status" = "4" ]; then
              echo "Deployment succeeded."
              exit 0
            fi
            if [ "$status" = "3" ]; then
              echo "Deployment failed." >&2
              exit 1
            fi
            sleep 15
          done

          echo "Timed out waiting for deployment to complete." >&2
          exit 1
