# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - itmd547-nocobase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: yarn install, nocobase install, and build
        run: |
          yarn install --frozen-lockfile
          yarn nocobase install
          yarn build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CD47F7883DA34B8C81D186854E74D4DD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E87DC99333B741EA9774AF4AE09A48FE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_24ADC0A076DF48B08721C3E5AE83E7FC }}

      - name: Disable Azure server-side build
        shell: bash
        run: |
          resource_group="$(az resource list \
            --name Parlour \
            --resource-type Microsoft.Web/sites \
            --query '[0].resourceGroup' \
            --output tsv)"

          if [ -z "$resource_group" ]; then
            echo "Unable to find the Azure resource group for Parlour." >&2
            exit 1
          fi

          az webapp config appsettings set \
            --name Parlour \
            --resource-group "$resource_group" \
            --settings \
              APP_PORT=8080 \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              ENABLE_ORYX_BUILD=false
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'itmd547-nocobase'
          slot-name: 'Production'
          package: .
