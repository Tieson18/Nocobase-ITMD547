# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - itmd547-nocobase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Enable Corepack (ensures correct Yarn version)
        run: corepack enable

      - name: Set Yarn network timeout
        run: yarn config set network-timeout 600000

      - name: yarn install and build
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CD47F7883DA34B8C81D186854E74D4DD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E87DC99333B741EA9774AF4AE09A48FE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_24ADC0A076DF48B08721C3E5AE83E7FC }}

      - name: Configure App Service startup
        shell: bash
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          INIT_ROOT_PASSWORD: ${{ secrets.INIT_ROOT_PASSWORD }}
        run: |
          resource_group="$(az webapp list \
            --query "[?name=='itmd547-nocobase'].resourceGroup | [0]" \
            --output tsv)"

          if [ -z "$resource_group" ]; then
            echo "App Service 'itmd547-nocobase' was not found in the authenticated subscription." >&2
            exit 1
          fi

          echo "resource_group=$resource_group" >> "$GITHUB_ENV"

          az webapp config appsettings set \
            --name itmd547-nocobase \
            --resource-group "$resource_group" \
            --settings \
              APP_ENV=production \
              APP_PORT=8080 \
              WEBSITES_PORT=8080 \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              ENABLE_ORYX_BUILD=false \
              API_BASE_PATH=/api/ \
              DB_LOGGING=off \
              DB_DIALECT=postgres \
              DB_PORT=5432 \
              DB_DIALECT_OPTIONS_SSL_MODE=require \
              DB_DIALECT_OPTIONS_SSL_REJECT_UNAUTHORIZED=false \
              INIT_ROOT_EMAIL=admin@nocobase.com \
              INIT_ROOT_NICKNAME="Super Admin" \
              INIT_ROOT_USERNAME=nocobase \
              APP_KEY="$APP_KEY" \
              DB_HOST="$DB_HOST" \
              DB_DATABASE="$DB_DATABASE" \
              DB_USER="$DB_USER" \
              DB_PASSWORD="$DB_PASSWORD" \
              INIT_ROOT_PASSWORD="$INIT_ROOT_PASSWORD"

          az webapp config set \
            --name itmd547-nocobase \
            --resource-group "$resource_group" \
            --startup-file "bash startup.sh"

      - name: 'Deploy to Azure Web App (clean)'
        shell: bash
        run: |
          # A clean deploy is required: previous deployments left a stale
          # oryx-manifest.toml / node_modules.tar.gz in /home on the App
          # Service, and a non-clean zip deploy merges on top of that
          # instead of replacing it, so the container unpacks an outdated,
          # incomplete node_modules missing the nocobase-v1 binary.
          zip -r -q ../app.zip . -x ".git/*"

          az webapp deploy \
            --resource-group "$resource_group" \
            --name itmd547-nocobase \
            --src-path ../app.zip \
            --type zip \
            --clean true \
            --restart true
